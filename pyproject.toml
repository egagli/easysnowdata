# ── Package ───────────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "easysnowdata"
description = "A Python package to easily retrieve data relevant to snow science"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT License" }
authors = [{ name = "Eric Gagliano", email = "egagli@uw.edu" }]
keywords = ["snow", "hydrology", "remote-sensing", "climate", "geospatial"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
# The version comes from the git tag (hatch-vcs); see [tool.hatch.version].
dynamic = ["version"]
# One install, no extras (REVAMP_PLAN §10). Floors follow §10.1.
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "geopandas>=1.1",
    "pyogrio>=0.12",
    "pyarrow",
    "pyproj",
    "rasterio>=1.5",
    "xarray>=2026.2",
    "rioxarray>=0.22",
    "shapely>=2",
    "pystac>=1.12",
    "pystac-client>=0.8",
    "planetary-computer",
    "odc-stac>=0.5",
    "odc-geo>=0.5",
    "earthengine-api",
    "xee>=0.1",
    "beautifulsoup4",
    "earthaccess>=0.17",
    "pooch",
    "pyyaml",
    "requests",
    "lxml",
    "scikit-image",
    "tqdm",
    "dask",
    "zarr>=3.1",
    "gcsfs",
    "s3fs",
    "fsspec",
    "h5netcdf",
    # h5netcdf >= 1.8 made h5py an optional extra on PyPI; declare the backend we use
    "h5py",
]

[project.urls]
Homepage = "https://github.com/egagli/easysnowdata"
Documentation = "https://egagli.github.io/easysnowdata"
Repository = "https://github.com/egagli/easysnowdata"
"Bug Tracker" = "https://github.com/egagli/easysnowdata/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# A checkout without tags (a GitHub zip, fetch-depth 1) still builds.
fallback_version = "0.0.0+unknown"

[tool.hatch.build.hooks.vcs]
version-file = "easysnowdata/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["easysnowdata"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/docs/examples/planet_data",
    "/docs/examples/data",
    "/data_status",
    "/.github",
    "/.pixi",
    "/ee_key.json",
]

# ── Release (bump-my-version until the release workflow changes in Phase 5) ──
# The tag it creates is what hatch-vcs reads; the files below are the ones
# that still carry a literal version.
[tool.bumpversion]
current_version = "0.0.26"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "version: v{current_version}"
replace = "version: v{new_version}"

[[tool.bumpversion.files]]
filename = "CITATION.cff"
regex = true
search = "date-released: '\\d{{4}}-\\d{{2}}-\\d{{2}}'"
replace = "date-released: '{now:%Y-%m-%d}'"

# ── Lint / format ─────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line too long — handled by formatter
    "F841",  # local variable assigned but never used
]

[tool.ruff.lint.isort]
known-first-party = ["easysnowdata"]

[tool.ruff.format]
quote-style = "double"

# ── Tests ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests that make network requests to a data provider (deselected in the offline tier)",
    "requires_earthengine: marks tests that need Google Earth Engine credentials (EARTHENGINE_TOKEN or ~/.config/earthengine/credentials)",
    "requires_earthaccess: marks tests that need NASA Earthdata credentials (EARTHDATA_TOKEN, EARTHDATA_USERNAME + EARTHDATA_PASSWORD, or a ~/.netrc entry)",
    "requires_planet: marks tests that need Planet credentials (PL_API_KEY, PL_AUTH_* or a `planet auth login` session)",
    "requires_nve: marks tests that need an NVE HydAPI key (NVE_API_KEY)",
    "recorded: marks tests replayed from pytest-recording cassettes or run against the tiny local fixtures (offline tier)",
    "integration: marks slow integration tests that make live external API calls",
]
# Do not name an easysnowdata warning class here: pytest imports the module to
# resolve it before pytest-cov starts, which hides every module-level line
# from coverage. The deprecation tests assert with pytest.warns instead.
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
# The new modules (Phase 1); the legacy modules are covered by the live tier
# until Phase 2 migrates them onto providers/.
source = ["easysnowdata"]
omit = [
    "easysnowdata/remote_sensing.py",
    "easysnowdata/hydroclimatology.py",
    "easysnowdata/topography.py",
    "easysnowdata/automatic_weather_stations.py",
    "easysnowdata/utils.py",
    "easysnowdata/_version.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95

# ── Environments (pixi; one dependency list with [project] above) ─────────────
# `pixi install` resolves conda-forge first and installs this package
# editable; the PyPI requirements in [project.dependencies] are satisfied by
# the conda packages below (pixi maps the names).
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.15"
numpy = "*"
matplotlib = "*"
pandas = "*"
geopandas = ">=1.1"
pyogrio = ">=0.12"
pyarrow = "*"
pyproj = "*"
rasterio = ">=1.5"
xarray = ">=2026.2"
rioxarray = ">=0.22"
shapely = ">=2"
pystac = ">=1.12"
pystac-client = ">=0.8"
planetary-computer = "*"
odc-stac = ">=0.5"
odc-geo = ">=0.5"
earthengine-api = "*"
xee = ">=0.1"
beautifulsoup4 = "*"
earthaccess = ">=0.17"
pooch = "*"
pyyaml = "*"
requests = "*"
lxml = "*"
scikit-image = "*"
tqdm = "*"
dask = "*"
zarr = ">=3.1"
gcsfs = "*"
s3fs = "*"
fsspec = "*"
h5netcdf = "*"
# h5netcdf >= 1.8 made h5py an optional extra on PyPI; declare the backend we use
h5py = "*"
# GDAL HDF4 driver (conda-forge splits it out of libgdal-core); needed to read
# the MOD10A1F HDF-EOS2 granules. Not a Python package, so pixi-only.
libgdal-hdf4 = "*"

[tool.pixi.pypi-dependencies]
easysnowdata = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
pytest = "*"
pytest-socket = "*"
pytest-cov = ">=7.1.0,<8"
pytest-recording = ">=0.13.4,<0.14"
pytest-xdist = ">=3.8.0,<4"
packaging = ">=26.3,<27"
# Notebook conveniences used by docs/examples, not imported by the package
contextily = "*"
folium = "*"
mapclassify = "*"
py3dep = "*"
ruff = "*"
pre-commit = "*"
ipykernel = "*"
nbconvert = "*"
nbformat = "*"
mkdocs = "*"
mkdocs-material = ">=9.1.3"
mkdocstrings = "*"
mkdocstrings-python = "*"
pygments = "*"
pymdown-extensions = "*"
python-build = "*"
hatchling = "*"
hatch-vcs = "*"
bump-my-version = "*"
twine = "*"
codespell = "*"

[tool.pixi.feature.dev.pypi-dependencies]
mkdocs-jupyter = ">=0.24.0"
mkdocs-git-revision-date-localized-plugin = "*"
git-changelog = "*"

[tool.pixi.feature.dev.tasks]
# Offline tier: deselects every test marked `live` and blocks socket use so a
# test that quietly reaches the network fails instead of passing by accident.
# --allow-unix-socket keeps the network blocked but lets asyncio (zarr 3, fsspec)
# create its event-loop socketpair.
test-unit = "pytest tests/ -m 'not live' --disable-socket --allow-unix-socket"
# Recorded tier only: STAC searches replayed from tests/cassettes and the local
# fixtures; --record-mode=none (the default) fails on a missing cassette.
test-recorded = "pytest tests/ -m recorded --disable-socket --allow-unix-socket --record-mode=none"
# Offline tier with line coverage of the new modules ([tool.coverage.*] above)
test-cov = "pytest tests/ -m 'not live' --disable-socket --allow-unix-socket --cov --cov-report=term-missing --cov-report=xml"
# Refresh the cassettes (needs network; run before committing a changed search)
record-cassettes = "pytest tests/test_recorded.py --record-mode=rewrite"
# Live tier: one smoke test per data source; needs network and, for the
# requires_* tests, provider credentials (otherwise they skip).
test-live = "pytest tests/ -m live"
test = "pytest tests/"
lint = "ruff check easysnowdata/ tests/ scripts/"
format = "ruff format easysnowdata/ tests/ scripts/"
build = "python -m build"
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"
changelog = "git-changelog --output CHANGELOG.md"
check-sources = "python scripts/check_data_sources.py"
update-status = "python scripts/update_readme_status.py"

# One feature per interpreter so CI can lock and test each Python separately.
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

# ruff only — the lint job does not need GDAL and friends.
[tool.pixi.feature.lint.dependencies]
ruff = "*"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
lint = { features = ["lint"], no-default-feature = true }
test-py312 = { features = ["dev", "py312"] }
test-py313 = { features = ["dev", "py313"] }
test-py314 = { features = ["dev", "py314"] }
