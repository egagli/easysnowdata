[project]
name = "easysnowdata"
version = "0.0.26"
description = "A Python package to easily retrieve data relevant to snow science"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT License" }
authors = [{ name = "Eric Gagliano", email = "egagli@uw.edu" }]
keywords = ["snow", "hydrology", "remote-sensing", "climate", "geospatial"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy",
    "matplotlib",
    "pandas",
    "geopandas",
    "rasterio",
    "xarray",
    "rioxarray",
    "shapely",
    "pystac-client",
    "planetary-computer",
    "odc-stac",
    "earthengine-api",
    "xee>=0.1",
    "beautifulsoup4",
    "earthaccess",
    "pooch",
    "pyyaml",
    "requests",
    "lxml",
    "scikit-image",
    "tqdm",
    "dask",
    "zarr",
    "gcsfs",
    "h5netcdf",
    "h5py",
]

[project.urls]
Homepage = "https://github.com/egagli/easysnowdata"
Documentation = "https://egagli.github.io/easysnowdata"
Repository = "https://github.com/egagli/easysnowdata"
"Bug Tracker" = "https://github.com/egagli/easysnowdata/issues"

[tool.setuptools.packages.find]
include = ["easysnowdata*"]
exclude = ["docs*", "tests*", "scripts*"]

[tool.bumpversion]
current_version = "0.0.26"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pixi.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "easysnowdata/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "version: v{current_version}"
replace = "version: v{new_version}"

[[tool.bumpversion.files]]
filename = "CITATION.cff"
regex = true
search = "date-released: '\\d{{4}}-\\d{{2}}-\\d{{2}}'"
replace = "date-released: '{now:%Y-%m-%d}'"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line too long — handled by formatter
    "F841",  # local variable assigned but never used
]

[tool.ruff.lint.isort]
known-first-party = ["easysnowdata"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests that make network requests to a data provider (deselected in the offline tier)",
    "requires_earthengine: marks tests that need Google Earth Engine credentials (EARTHENGINE_TOKEN or ~/.config/earthengine/credentials)",
    "requires_earthaccess: marks tests that need NASA Earthdata credentials (EARTHDATA_TOKEN, EARTHDATA_USERNAME + EARTHDATA_PASSWORD, or a ~/.netrc entry)",
    "requires_planet: marks tests that need Planet credentials (PL_API_KEY, PL_AUTH_* or a `planet auth login` session)",
    "requires_nve: marks tests that need an NVE HydAPI key (NVE_API_KEY)",
    "recorded: marks tests replayed from pytest-recording cassettes or run against the tiny local fixtures (offline tier)",
    "integration: marks slow integration tests that make live external API calls",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    # our own deprecations must stay visible in the test output
    "default::easysnowdata._deprecation.EasysnowdataDeprecationWarning",
]

[tool.coverage.run]
# The new modules (Phase 1); the legacy modules are covered by the live tier
# until Phase 2 migrates them onto providers/.
source = ["easysnowdata"]
omit = [
    "easysnowdata/remote_sensing.py",
    "easysnowdata/hydroclimatology.py",
    "easysnowdata/topography.py",
    "easysnowdata/automatic_weather_stations.py",
    "easysnowdata/utils.py",
    "easysnowdata/_version.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"
