# ── Pages and feeds ───────────────────────────────────────────────────────────
# Fetched, reduced to their visible text, diffed against last week, and each
# new line keyword-tagged. Noisy by nature, which is why the digest groups
# them under "changed" and "other" unless a keyword promotes them.
#
# Not watched (dropped 2026-09-28): the earthdata.nasa.gov alerts, ASF DAAC
# and LP DAAC news pages. CloudFront answers GitHub's runners with a 403
# whatever the User-Agent (a home IP gets a 200), so they were a permanent
# "could not be checked" line. CMR (hosting, versions, extents) and the health
# probes cover what those pages would have told us.

