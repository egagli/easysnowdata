# What to watch upstream, and what a change in it would mean (REVAMP_PLAN §8).
#
# `scripts/watch.py` fetches every entry once a week, diffs it against the
# snapshot of the previous run in `data_status/watch/`, tags each new or
# changed item with the categories below, and opens one digest issue. Reading
# the digest and acting on it is a human job; this file only decides what gets
# looked at.
#
# Each entry has:
#   kind      how to fetch and compare it — see the sections below
#   id        the snapshot file name; stable, so renaming an entry starts over
#   products  catalog products affected, so the digest can say what is at stake
#   match_products
#             for an entry that covers several unrelated datasets: key →
#             products, matched at a word start (and end, for 1-3 letters). A subject or a page line containing the key affects
#             those products only; `products` is the fallback when nothing
#             matches. On a page or feed with this table, a line that matches
#             nothing (news about a dataset this package does not use) cannot
#             be "action needed"; a snow term still makes it "worth adding".
#   url /     what to fetch (kind-specific)
#   keywords  extra words that mark a page line as about something we use, so
#             its tags stand even when no `match_products` key matched
#   ignore    regexes (case-insensitive) for page lines that change on every
#             visit; scripts/watch.py has a default list (DEFAULT_IGNORE)
#
# The categories every item is tagged against live in scripts/watch.py
# (CATEGORIES); they are the §8 list: removal, deprecation, reprocessing,
# extent, stations, new dataset, outage.

# ── Programmatic checks ───────────────────────────────────────────────────────
# No text parsing. These catch a change before any changelog mentions it.

# CMR collections: a version_id or revision_date bump is how reprocessing
# reaches us, and the granule count is how an archiving stop shows up.
[[cmr]]
id = "cmr-mod10a1f"
short_name = "MOD10A1F"
products = ["modis-snow"]

[[cmr]]
id = "cmr-mod10a2"
short_name = "MOD10A2"
products = ["modis-snow"]
# §13.4: PC stopped archiving this; NSIDC is the only route left, so a change
# here is load-bearing.

[[cmr]]
id = "cmr-vnp10a1f"
short_name = "VNP10A1F"
products = ["viirs-snow"]

[[cmr]]
id = "cmr-wus-ucla-sr"
short_name = "WUS_UCLA_SR"
products = ["ucla-snow-reanalysis"]

[[cmr]]
id = "cmr-hls-s30"
short_name = "HLSS30"
products = ["hls"]

[[cmr]]
id = "cmr-hls-l30"
short_name = "HLSL30"
products = ["hls"]

[[cmr]]
id = "cmr-opera-rtc-s1"
short_name = "OPERA_L2_RTC-S1_V1"
products = ["sentinel-1-rtc"]

[[cmr]]
id = "cmr-nsidc-0768"
short_name = "NSIDC-0768"
products = ["snow-classification"]
# On-premises at NSIDC (provider NSIDCV0, not cloud hosted, no granules), so
# the loader needs the Earthdata password. A move shows up as `migration`.

[[cmr]]
id = "cmr-nsidc-0770"
short_name = "NSIDC-0770"
products = ["rgi-glaciers"]
# RGI 6.0 and 7.0 (and the older versions), on-premises like NSIDC-0768.

# STAC collections: presence in /collections, the temporal extent, and the
# newest item. Catches a collection quietly disappearing (the MOD10A2 case)
# or stopping.
[[stac]]
id = "stac-pc"
url = "https://planetarycomputer.microsoft.com/api/stac/v1"
collections = [
    "sentinel-1-rtc",
    "sentinel-2-l2a",
    "cop-dem-glo-30",
    "cop-dem-glo-90",
    "esa-worldcover",
    "modis-10A1-061",
    "modis-10A2-061",
    "hls2-s30",
    "hls2-l30",
]
products = []
[stac.match_products]
"sentinel-1-rtc" = ["sentinel-1-rtc"]
"sentinel-2-l2a" = ["sentinel-2-l2a"]
"cop-dem" = ["copernicus-dem"]
"esa-worldcover" = ["esa-worldcover"]
"modis-10A" = ["modis-snow"]
"hls2-" = ["hls"]

[[stac]]
id = "stac-earth-search"
url = "https://earth-search.aws.element84.com/v1"
collections = [
    "sentinel-2-l2a",
    "sentinel-2-c1-l2a",
    "cop-dem-glo-30",
]
products = []
match_products = { "sentinel-2" = ["sentinel-2-l2a"], "cop-dem" = ["copernicus-dem"] }
# sentinel-2-c1-l2a is the route that still carries the baseline offset in the
# pixels (§13.1 C1); PC issue #394 asks for it on PC too.

[[stac]]
id = "stac-cmr-lpcloud"
url = "https://cmr.earthdata.nasa.gov/stac/LPCLOUD"
collections = ["HLSS30_2.0", "HLSL30_2.0"]
products = ["hls"]

[[stac]]
id = "stac-cmr-asf"
url = "https://cmr.earthdata.nasa.gov/cloudstac/ASF"
collections = ["OPERA_L2_RTC-S1_V1_1", "OPERA_L2_RTC-S1-STATIC_V1_1"]
products = []
match_products = { "RTC-S1_V1" = ["sentinel-1-rtc"], "RTC-S1-STATIC" = ["sentinel-1-local-incidence-angle"] }

