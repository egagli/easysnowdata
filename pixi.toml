[workspace]
name = "easysnowdata"
version = "0.0.26"
description = "A Python package to easily retrieve data relevant to snow science"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.12,<3.14"
numpy = "*"
matplotlib = "*"
pandas = "*"
geopandas = "*"
rasterio = "*"
xarray = "*"
rioxarray = "*"
shapely = "*"
pystac-client = "*"
planetary-computer = "*"
odc-stac = "*"
earthengine-api = "*"
xee = ">=0.1"
beautifulsoup4 = "*"
earthaccess = "*"
pooch = "*"
pyyaml = "*"
requests = "*"
lxml = "*"
scikit-image = "*"
tqdm = "*"
dask = "*"
zarr = "*"
gcsfs = "*"
fsspec = "*"
h5netcdf = "*"
# h5netcdf >= 1.8 made h5py an optional extra on PyPI; declare the backend we use
h5py = "*"
# GDAL HDF4 driver (conda-forge splits it out of libgdal-core); needed to read
# the MOD10A1F HDF-EOS2 granules. Not a Python package, so pixi-only.
libgdal-hdf4 = "*"

[feature.dev.dependencies]
pytest = "*"
pytest-socket = "*"
# Notebook conveniences used by docs/examples, not imported by the package
contextily = "*"
folium = "*"
mapclassify = "*"
py3dep = "*"
ruff = "*"
pre-commit = "*"
ipykernel = "*"
nbconvert = "*"
nbformat = "*"
mkdocs = "*"
mkdocs-material = ">=9.1.3"
mkdocstrings = "*"
mkdocstrings-python = "*"
pygments = "*"
pymdown-extensions = "*"
python-build = "*"
bump-my-version = "*"
twine = "*"
codespell = "*"
pytest-cov = ">=7.1.0,<8"
pytest-recording = ">=0.13.4,<0.14"
pytest-xdist = ">=3.8.0,<4"
packaging = ">=26.3,<27"

[feature.dev.pypi-dependencies]
mkdocs-jupyter = ">=0.24.0"
mkdocs-git-revision-date-localized-plugin = "*"
git-changelog = "*"

[feature.dev.tasks]
# Offline tier: deselects every test marked `live` and blocks socket use so a
# test that quietly reaches the network fails instead of passing by accident.
# --allow-unix-socket keeps the network blocked but lets asyncio (zarr 3, fsspec)
# create its event-loop socketpair.
test-unit = "pytest tests/ -m 'not live' --disable-socket --allow-unix-socket"
# Recorded tier only: STAC searches replayed from tests/cassettes and the local
# fixtures; --record-mode=none (the default) fails on a missing cassette.
test-recorded = "pytest tests/ -m recorded --disable-socket --allow-unix-socket --record-mode=none"
# Offline tier with line coverage of the new modules ([tool.coverage.*] in pyproject.toml)
test-cov = "pytest tests/ -m 'not live' --disable-socket --allow-unix-socket --cov --cov-report=term-missing --cov-report=xml"
# Refresh the cassettes (needs network; run before committing a changed search)
record-cassettes = "pytest tests/test_recorded.py --record-mode=rewrite"
# Live tier: one smoke test per data source; needs network and, for the
# requires_* tests, provider credentials (otherwise they skip).
test-live = "pytest tests/ -m live"
test = "pytest tests/"
lint = "ruff check easysnowdata/ tests/ scripts/"
format = "ruff format easysnowdata/ tests/ scripts/"
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"
changelog = "git-changelog --output CHANGELOG.md"
check-sources = "python scripts/check_data_sources.py"
update-status = "python scripts/update_readme_status.py"

[environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
