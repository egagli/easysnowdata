name: Data Source Health Check

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip README commit)"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # The probes live in easysnowdata.catalog.health and use the package's
      # own auth module, so the check runs from the same pixi environment as
      # the tests.
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.65.0
          environments: test-py313
          locked: true

      - name: Run health checks
        env:
          EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          EASYSNOWDATA_QUIET: "1"
        run: pixi run -e test-py313 python scripts/check_data_sources.py --output data_status/history.json

      - name: Update README status table
        run: pixi run -e test-py313 python scripts/update_readme_status.py

      - name: Commit and push if changed
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_status/history.json README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly data source health check [skip ci]"
            git push origin HEAD
          fi
