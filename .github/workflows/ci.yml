name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly live tier: every Tuesday at 08:00 UTC (the data-source health
    # check runs on Mondays).
    - cron: "0 8 * * 2"
  workflow_dispatch:
    inputs:
      run_live:
        description: "Also run the live tier (needs the repository secrets)"
        type: boolean
        default: true

# The environments come from pixi.lock (conda-forge), so every job sees the
# same GDAL (with the HDF4 driver), PROJ and Python stack that users get from
# conda-forge. `locked: true` refuses to run if the lock is out of date.
env:
  PIXI_VERSION: v0.65.0

jobs:
  # ── Linting ────────────────────────────────────────────────────────────────
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: lint
          locked: true
      - name: Check formatting
        run: pixi run -e lint ruff format --check easysnowdata/ tests/ scripts/
      - name: Check linting
        run: pixi run -e lint ruff check easysnowdata/ tests/ scripts/

  # ── Offline tiers: unit + recorded (every push / PR) ───────────────────────
  # Sockets are disabled (Unix sockets allowed for zarr's asyncio loop) and
  # cassettes replay with --record-mode=none, so no credentials or network.
  test-offline:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            environment: test-py312
          - os: ubuntu-latest
            environment: test-py313
          - os: ubuntu-latest
            environment: test-py314
          - os: macos-latest
            environment: test-py313
          - os: windows-latest
            environment: test-py313
          # `dev` resolves separately from the test-py3XX environments, which
          # have no solve-group, so it is a different stack — measurably: it
          # had rasterio 1.5.0 / GDAL 3.12.3 where test-py313 had 1.5.1 /
          # 3.13.3, and that gap cost a red CI run nobody could reproduce
          # locally (#20). Keeping the interpreter environments free-solving is
          # the point of the matrix, so instead the stack contributors actually
          # type is covered here too.
          - os: ubuntu-latest
            environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs derives the version from tags
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: ${{ matrix.environment }}
          locked: true
      - name: Import without side effects
        run: pixi run -e ${{ matrix.environment }} python -c "import easysnowdata, rasterio; assert not rasterio.env.hasenv(); print(easysnowdata.__version__)"
        env:
          EASYSNOWDATA_QUIET: "1"
      - name: Run unit and recorded tiers
        run: pixi run -e ${{ matrix.environment }} test-unit -v --tb=short

  # ── Coverage of the new modules (one leg) ──────────────────────────────────
  coverage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: test-py313
          locked: true
      - name: Offline tiers with coverage
        run: pixi run -e test-py313 test-cov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # ── Docs smoke test: prose, API and catalog pages, no gallery execution ────
  # The full docs job (.github/workflows/docs.yml) executes the gallery and
  # takes minutes; this one takes seconds and catches the common breakage —
  # a page missing from the toctree, a dead cross-reference, a product whose
  # catalog entry no longer renders.
  docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: docs
          locked: true
      - name: Build the docs without the gallery
        env:
          ESD_DOCS_GALLERY: none
          EASYSNOWDATA_QUIET: "1"
        run: pixi run -e docs sphinx-build -b html docs docs/_build/html -d docs/_build/doctrees -j auto -W --keep-going

  # ── Live tests (weekly schedule and manual runs) ───────────────────────────
  # One smoke test per data source against the real providers, with the
  # repository secrets. Tests whose credentials are missing skip. Runs from the
  # conda-forge environment, so the MOD10A1F (HDF4) test now runs in CI.
  test-live:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_live)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: test-py313
          locked: true
      - name: Run live tests
        env:
          EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }}
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          PL_API_KEY: ${{ secrets.PL_API_KEY }}
          NVE_API_KEY: ${{ secrets.NVE_API_KEY }}
        run: pixi run -e test-py313 test-live -v --tb=short -rfEs
